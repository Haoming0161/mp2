name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        # `npm ci` requires a committed package-lock.json. This repository was
        # bootstrapped in an environment where the npm registry was blocked, so
        # install directly until a lockfile can be generated and committed.
        run: npm install --no-audit --no-fund

      - name: Build site
        run: npm run build

      # GitHub Pages has no server-side SPA fallback. Serving the Vite entry
      # point as 404.html lets direct links such as /mp2/pokemon/25 load and
      # allows React Router to resolve the requested route in the browser.
      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Vite's build output dir (CRA used ./build)
          path: ./dist
  
  deploy:
    needs: build

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
      
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
